[project]
name = "measurer"
version = "0.1.0"
description = "Uses reference object - ruler and homography to get pixel to unit (cm/in/etc.) ratio and measure real distance between any two points on that image"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "opencv-python>=5.0.0.93",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
